<title id="t">Laws titled Basic Law passed each year, 1958 to 2026: 130 laws, 14 of which later came before the Supreme Court</title>
<desc id="d">Column chart of the 130 laws titled Basic Law passed each year from 1958 to 2026. Most years before 1990 have none to two; the busiest year is 1996 with 13. 14 later came before the Court, challenged or ruled on as to their binding force; the first passed in 1992 and the last in 2026.</desc>
