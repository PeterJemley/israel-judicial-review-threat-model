<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="904" viewBox="0 0 1040 904" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The 14 laws titled Basic Law that came before the Court: passage, and what the Court did</title>
<desc id="d">Timeline of the 14 laws that came before the Court, from passage to judgment, 1992 to 2026. 6 are coded Adverse under T1's step 4, 1 Not adverse, and 7 are not yet coded; for two, no ruling had been found when last checked, on 21 and 22 October 2026.</desc>
<rect width="1040" height="904" fill="#fcfcfb"/>
<rect x="24" y="18" width="66" height="20" rx="10" fill="none" stroke="#52514e" stroke-width="1.5"/><text x="56.8" y="32.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#52514e">MEASURED</text><text x="24.0" y="64.0" font-size="19" font-weight="600" text-anchor="start" fill="#0b0b0b">The 14 laws titled Basic Law that came before the Court: passage, and what the Court did</text><text x="24.0" y="90.0" font-size="13" font-weight="normal" text-anchor="start" fill="#52514e">Each line runs from passage to judgment. The words on the right are the challenge reader's provisional outcome classes; shape and colour</text><text x="24.0" y="108.0" font-size="13" font-weight="normal" text-anchor="start" fill="#52514e">give T1's step-4 code where a docket reader has coded the law.</text><line x1="300.0" x2="300.0" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="300.0" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">1990</text><line x1="351.4" x2="351.4" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="351.4" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">1995</text><line x1="402.7" x2="402.7" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="402.7" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">2000</text><line x1="454.1" x2="454.1" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="454.1" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">2005</text><line x1="505.4" x2="505.4" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="505.4" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">2010</text><line x1="556.8" x2="556.8" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="556.8" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">2015</text><line x1="608.1" x2="608.1" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="608.1" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">2020</text><line x1="659.5" x2="659.5" y1="166" y2="676" stroke="#e1e0d9" stroke-width="1"/><text x="659.5" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">2025</text><text x="24.0" y="194.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Human Dignity and Liberty (1992)</text><line x1="322.7" x2="360.2" y1="190.0" y2="190.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="322.7" cy="190.0" r="3" fill="#52514e"/><rect x="355.2" y="185.0" width="10" height="10" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="194.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Applied (1995-11-09)</text><text x="24.0" y="230.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Freedom of Occupation (re-enactment) (1994)</text><line x1="343.0" x2="370.9" y1="226.0" y2="226.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="343.0" cy="226.0" r="3" fill="#52514e"/><path d="M370.9,220.0L376.9,231.0L364.9,231.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="223.5" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Review foreclosed (1994 (exact date not found));</text><text x="698.0" y="236.5" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Upheld (1996-11-25)</text><text x="24.0" y="266.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Government (Amendment No. 9) (1999)</text><line x1="398.5" x2="397.6" y1="262.0" y2="262.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="398.5" cy="262.0" r="3" fill="#52514e"/><circle cx="397.6" cy="262.0" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="698.0" y="266.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Upheld (1999 (exact date not found))</text><text x="24.0" y="302.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">State Budget for 2009 and 2010 (Amendment) (2010)</text><line x1="510.3" x2="518.4" y1="298.0" y2="298.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="510.3" cy="298.0" r="3" fill="#52514e"/><circle cx="518.4" cy="298.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="302.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Upheld (2011-04-07)</text><text x="24.0" y="338.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Knesset (Amendment No. 44) (2016)</text><line x1="572.7" x2="591.8" y1="334.0" y2="334.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="572.7" cy="334.0" r="3" fill="#52514e"/><circle cx="591.8" cy="334.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="338.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Upheld (2018-05-27)</text><text x="24.0" y="374.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">State Budget for 2017 and 2018 (2016)</text><line x1="573.1" x2="584.3" y1="370.0" y2="370.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="573.1" cy="370.0" r="3" fill="#52514e"/><path d="M584.3,364.0L590.3,375.0L578.3,375.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="374.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Invalidity warning (2017-09-06)</text><text x="24.0" y="410.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Nation State of the Jewish People (2018)</text><line x1="593.2" x2="623.7" y1="406.0" y2="406.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="593.2" cy="406.0" r="3" fill="#52514e"/><path d="M623.7,400.0L629.7,411.0L617.7,411.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="410.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Upheld (2021-07-08)</text><text x="24.0" y="446.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Government (Amendment No. 8) (2020)</text><line x1="611.7" x2="623.9" y1="442.0" y2="442.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="611.7" cy="442.0" r="3" fill="#52514e"/><circle cx="623.9" cy="442.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="446.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Upheld (2021-07-12)</text><text x="24.0" y="482.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Knesset (Amendment No. 50) (2020)</text><line x1="614.8" x2="622.4" y1="478.0" y2="478.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="614.8" cy="478.0" r="3" fill="#52514e"/><path d="M622.4,472.0L628.4,483.0L616.4,483.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="482.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Invalidity warning (2021-05-23)</text><text x="24.0" y="518.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Government (Amendment No. 11) (2022)</text><line x1="638.8" x2="639.4" y1="514.0" y2="514.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="638.8" cy="514.0" r="3" fill="#52514e"/><circle cx="639.4" cy="514.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="511.5" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Not decided: the Court found it unnecessary to</text><text x="698.0" y="524.5" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">rule on the amendment (2023-01-18)</text><text x="24.0" y="554.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Government (Amendment No. 12) (2023)</text><line x1="641.3" x2="649.3" y1="550.0" y2="550.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="641.3" cy="550.0" r="3" fill="#52514e"/><path d="M649.3,544.0L655.3,555.0L643.3,555.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="554.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Deferred (2024-01-03)</text><text x="24.0" y="590.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Judiciary (Amendment No. 3) (2023)</text><line x1="644.7" x2="649.2" y1="586.0" y2="586.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="644.7" cy="586.0" r="3" fill="#52514e"/><path d="M649.2,580.0L655.2,591.0L643.2,591.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="698.0" y="590.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Struck (2024-01-01)</text><text x="24.0" y="626.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">The Judiciary (Amendment No. 4) (2025)</text><line x1="661.9" x2="678.1" y1="622.0" y2="622.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="661.9" cy="622.0" r="3" fill="#52514e"/><circle cx="678.1" cy="622.0" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="698.0" y="626.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Pending (no ruling found by 21 October 2026)</text><text x="24.0" y="662.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Torah Study (2026)</text><line x1="675.2" x2="678.1" y1="658.0" y2="658.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="675.2" cy="658.0" r="3" fill="#52514e"/><circle cx="678.1" cy="658.0" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="698.0" y="655.5" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Pending (at the challenge reader's search, 22</text><text x="698.0" y="668.5" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">October 2026)</text><circle cx="27" cy="698" r="3" fill="#52514e"/><text x="36.0" y="702.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Passed</text><path d="M110.0,692.0L116.0,703.0L104.0,703.0Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="122.0" y="702.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Judgment, Adverse under T1 step 4</text><rect x="355.0" y="693.0" width="10" height="10" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="372.0" y="702.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Not adverse</text><circle cx="480.0" cy="698.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="492.0" y="702.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Not yet coded</text><circle cx="610.0" cy="698.0" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="622.0" y="702.0" font-size="12" font-weight="normal" text-anchor="start" fill="#0b0b0b">Hollow: no ruling found, or judgment dated by year only</text><text x="24.0" y="732.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Under T1's step 4 a law the Court upheld but read narrowly counts as Adverse, so the provisional class and the code can differ (the 1994 and 2018 rows).</text><text x="24.0" y="747.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">The challenge reader's classes for the 1994 Porat petition and the 1999 case are provisional, as its notes say. Where a law was challenged twice, the line</text><text x="24.0" y="762.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">ends at the later judgment. Human Dignity and Liberty was not petitioned against; the Court decided its binding force in Mizrahi Bank</text><text x="24.0" y="777.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">(research/frame/challenges.json). The 2025 row: no ruling found by 21 October 2026 (research/2025-2026-timeline.md). The 2026 row: pending at the challenge</text><text x="24.0" y="792.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">reader's search on 22 October 2026 (research/frame/challenges.json).</text><text x="24.0" y="811.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">Scope: Israel; laws titled Basic Law as passed at third reading, 12 February 1958 to 13 July 2026. Dates are passage dates from the gazette footnotes,</text><text x="24.0" y="826.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">except five publication dates. Entries from December 2025 to October 2026 could not be checked against the Knesset's own database. Source:</text><text x="24.0" y="841.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">research/frame/basic-law-frame.csv (gazette texts through Internet Archive captures, Hebrew Wikisource, Nevo); challenges from the Court's own surveys in</text><text x="24.0" y="856.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">HCJ 5658/23 and HCJ 4908/10 and from searches, classed provisionally by the challenge reader.</text><text x="24.0" y="875.0" font-size="11" font-weight="normal" text-anchor="start" fill="#52514e">T1 codes: codebook/m4-codebook.csv. Table: figures/data/fig2-challenged-laws.csv.</text>
</svg>
