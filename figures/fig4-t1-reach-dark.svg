<svg xmlns="http://www.w3.org/2000/svg" width="960" height="763" viewBox="0 0 960 763" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Can T1 reach a verdict on this record? Only if every codable law left is discordant, and only for some numbers of Adverse outcomes</title>
<desc id="d">Grid of the configurations T1 could face with ten coded laws. A verdict is possible only with six discordant laws and six or seven Adverse outcomes, or five if a contestable Adverse code were reversed; with eight or more Adverse outcomes, or fewer than six discordant laws, no verdict is possible. The first run had five laws, four Adverse and one discordant, and could reach no verdict; nor could it after the 1994 row was recoded Adverse.</desc>
<rect width="960" height="763" fill="#1a1a19"/>
<rect x="24" y="18" width="87" height="20" rx="10" fill="none" stroke="#c3c2b7" stroke-width="1.5"/><text x="67.6" y="32.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#c3c2b7">CALCULATION</text><text x="24.0" y="64.0" font-size="19" font-weight="600" text-anchor="start" fill="#f0efec">Can T1 reach a verdict on this record? Only if every codable law left is discordant,</text><text x="24.0" y="88.0" font-size="19" font-weight="600" text-anchor="start" fill="#f0efec">and only for some numbers of Adverse outcomes</text><text x="24.0" y="114.0" font-size="13" font-weight="normal" text-anchor="start" fill="#c3c2b7">A calculation from T1's rule as revised on 22 October 2026, written after nine rows' outcomes were known and fixed before the</text><text x="24.0" y="132.0" font-size="13" font-weight="normal" text-anchor="start" fill="#c3c2b7">blind recoding. It uses only the number of laws (N), the number with Adverse outcomes (K) and the number on which T1's two</text><text x="24.0" y="150.0" font-size="13" font-weight="normal" text-anchor="start" fill="#c3c2b7">predictions differ.</text><text x="554.0" y="198.0" font-size="12" font-weight="600" text-anchor="middle" fill="#f0efec">Laws on which T1's two predictions differ (discordant)</text><text x="259.0" y="224.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7">1</text><text x="377.0" y="224.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7">2</text><text x="495.0" y="224.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7">3</text><text x="613.0" y="224.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7">4</text><text x="731.0" y="224.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7">5</text><text x="849.0" y="224.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#c3c2b7">6, the minimum</text><text x="24.0" y="224.0" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Adverse outcomes (K), of 10</text><text x="24.0" y="268.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7">K = 5 (only if a contestable</text><text x="24.0" y="282.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7">code were reversed)</text><rect x="201" y="239" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="259.0" y="268.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="319" y="239" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="377.0" y="268.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="437" y="239" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="495.0" y="268.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="555" y="239" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="613.0" y="268.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="673" y="239" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="731.0" y="268.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="791" y="239" width="116" height="50" rx="4" fill="#3987e5" fill-opacity="0.22" stroke="#3987e5" stroke-width="1.5"/><polyline points="799,256 802.5,259.5 809,252" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="816.0" y="260.0" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">verdict possible</text><text x="800.0" y="278.0" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">every split</text><text x="24.0" y="320.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b