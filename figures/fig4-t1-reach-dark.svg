ht="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="377.0" y="372.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="437" y="343" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="495.0" y="372.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="555" y="343" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="613.0" y="372.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="673" y="343" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="731.0" y="372.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="791" y="343" width="116" height="50" rx="4" fill="#3987e5" fill-opacity="0.22" stroke="#3987e5" stroke-width="1.5"/><polyline points="799,360 802.5,363.5 809,356" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="816.0" y="364.0" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">verdict possible</text><text x="800.0" y="382.0" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">splits 3/3</text><text x="24.0" y="424.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7">K = 8</text><rect x="201" y="395" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="259.0" y="424.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="319" y="395" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="377.0" y="424.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="437" y="395" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="495.0" y="424.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="555" y="395" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="613.0" y="424.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="673" y="395" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="731.0" y="424.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="791" y="395" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="849.0" y="424.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">no verdict</text><text x="24.0" y="476.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7">K = 9</text><rect x="201" y="447" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="259.0" y="476.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="319" y="447" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="377.0" y="476.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="437" y="447" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="495.0" y="476.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="555" y="447" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="613.0" y="476.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="673" y="447" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="731.0" y="476.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="791" y="447" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="849.0" y="476.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">no verdict</text><text x="24.0" y="528.0" font-size="12" font-weight="normal" text-anchor="start" fill="#c3c2b7">K = 10</text><rect x="201" y="499" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="259.0" y="528.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="319" y="499" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="377.0" y="528.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="437" y="499" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="495.0" y="528.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="555" y="499" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="613.0" y="528.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="673" y="499" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="731.0" y="528.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">below the minimum</text><rect x="791" y="499" width="116" height="50" rx="4" fill="none" stroke="#2c2c2a" stroke-width="1"/><text x="849.0" y="528.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#898781">no verdict</text><text x="24.0" y="576.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">Where the project stands: the first run had N = 5 coded laws, 4 of them Adverse, and 1 discordant; T1's check returned &quot;Inconclusive, declared</text><text x="24.0" y="591.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">before outcomes&quot;. After the 1994 row was recoded Adverse, K = 5 of 5 and the check again returned &quot;Inconclusive, declared before outcomes&quot;</text><text x="24.0" y="606.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">(research/coding-2026-10-22/results.md, third addendum).</text><text x="24.0" y="625.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">Why ten: on the challenge reader's provisional outcome classes, the frame holds 11 challenged Basic Laws decided from Mizrahi Bank (1995)</text><text x="24.0" y="640.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">onward with an outcome of Adverse or Not adverse; five are coded, the 1992 law cannot be coded until a record names its voters, and five</text><text x="24.0" y="655.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">remain codable (the Incapacity amendment, issue 19, and the four judged laws of issue 8). Six of the ten already have Adverse outcomes, so K</text><text x="24.0" y="670.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">is at least 6, unless a contestable code is reversed: the Nation-State and 1994 codes are both flagged (codebook/README.md; ledger F11). The</text><text x="24.0" y="685.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">existing discordant law is one the decision rule predicts Adverse, so every split has at least one such law. A split such as 3/3 gives the</text><text x="24.0" y="700.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">discordant laws the decision rule predicts Adverse, then those it predicts Not adverse.</text><text x="24.0" y="719.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">Calculation: analysis/t1_revised.py, detect, for every split. Audit: research/audit-2026-10-25.md, finding 3. Table:</text><text x="24.0" y="734.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">figures/data/fig4-t1-reach.csv.</text>
</svg>
