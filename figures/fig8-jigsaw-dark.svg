<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1128.0" viewBox="0 0 1000 1128.0" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Imagined jigsaw: how the project's questions might fit around its ideal</title>
<desc id="d">An imagined figure, drawn in violet. Seven pieces surround an empty centre, the project's ideal: Would the 2023 package remove the institutional checks that make Israel a democracy? (half-filled, 2 of 4 items established or refuted); Does the threat reach the state itself? (empty and tilted, 0 of 3 items established or refuted); Does the Court follow its warning signs or the laws' politics? (half-filled, 5 of 10 items established or refuted); Does Capability × Intent fit this case? (half-filled, 1 of 4 items established or refuted); What was the 2023 plan for? (empty and tilted, 0 of 4 items established or refuted); Is the Court acting for its own power? (half-filled, 1 of 2 items established or refuted); Is the record of Basic Laws complete and correct? (half-filled, 3 of 8 items established or refuted). Three numbered threads join pieces; each is captioned below with its premises and a conjecture.</desc>
<rect width="1000" height="1128.0" fill="#1a1a19"/>
<rect x="24" y="18" width="174" height="20" rx="10" fill="none" stroke="#9085e9" stroke-width="1.5"/><text x="110.8" y="32.0" font-size="11" font-weight="bold" text-anchor="middle" fill="#9085e9">IMAGINED. NOT A RESULT.</text><text x="24.0" y="64.0" font-size="19" font-weight="600" text-anchor="start" fill="#f0efec">Imagined jigsaw: how the project's questions might fit around its ideal</text><text x="24.0" y="90.0" font-size="13" font-weight="normal" text-anchor="start" fill="#c3c2b7">Imagined. Not a result. Each piece is a question. It half-fills when an item named on it is established, refuted, or inconclusive</text><text x="24.0" y="108.0" font-size="13" font-weight="normal" text-anchor="start" fill="#c3c2b7">under a rule set before the run, and fills only when all are established or refuted; a fill is not progress toward an answer.</text><text x="24.0" y="126.0" font-size="13" font-weight="normal" text-anchor="start" fill="#c3c2b7">Threads join pieces; their conclusions are conjectures.</text><line x1="277.2" y1="310.5" x2="777.9" y2="532.3" stroke="#9085e9" stroke-width="1.5" stroke-opacity="0.75"/><line x1="277.2" y1="310.5" x2="623.7" y2="710.2" stroke="#9085e9" stroke-width="1.5" stroke-opacity="0.75"/><line x1="376.3" y1="710.2" x2="777.9" y2="532.3" stroke="#9085e9" stroke-width="1.5" stroke-opacity="0.75"/><circle cx="500.0" cy="474" r="104" fill="#1a1a19" stroke="#9085e9" stroke-width="2"/><text x="500.0" y="436.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">The ideal, not reached:</text><text x="500.0" y="450.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">Medina's three claims (A</text><text x="500.0" y="464.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">to C) and the project's</text><text x="500.0" y="478.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">model claim (D), each</text><text x="500.0" y="492.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">supported or refuted by</text><text x="500.0" y="506.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">evidence that could have</text><text x="500.0" y="520.0" font-size="11" font-weight="600" text-anchor="middle" fill="#9085e9">gone either way</text><g><rect x="393.0" y="159.8" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="393.0" y="159.8" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><path d="M403.0,159.8H500.0V263.8H403.0Q393.0,263.8 393.0,253.8V169.8Q393.0,159.8 403.0,159.8Z" fill="#9085e9" fill-opacity="0.22"/><text x="405.0" y="179.8" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Would the 2023 package remove</text><text x="405.0" y="194.8" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">the institutional checks that</text><text x="405.0" y="209.8" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">make Israel a democracy?</text><text x="405.0" y="223.8" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Half-filled</text><text x="405.0" y="237.8" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">2 of 4 established or refuted</text><text x="405.0" y="252.8" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: A, E1, E2, E3</text></g><g transform="rotate(-6 722.8 310.5)"><rect x="615.8" y="258.5" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="615.8" y="258.5" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><text x="627.8" y="278.5" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Does the threat reach the</text><text x="627.8" y="293.5" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">state itself?</text><text x="627.8" y="322.5" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Empty, tilted: open</text><text x="627.8" y="336.5" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">0 of 3 established or refuted</text><text x="627.8" y="351.5" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: B, RB, E8</text></g><g><rect x="670.9" y="480.3" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="670.9" y="480.3" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><path d="M680.9,480.3H777.9V584.3H680.9Q670.9,584.3 670.9,574.3V490.3Q670.9,480.3 680.9,480.3Z" fill="#9085e9" fill-opacity="0.22"/><text x="682.9" y="500.3" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Does the Court follow its</text><text x="682.9" y="515.3" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">warning signs or the laws'</text><text x="682.9" y="530.3" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">politics?</text><text x="682.9" y="544.3" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Half-filled</text><text x="682.9" y="558.3" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">5 of 10 established or refuted</text><text x="682.9" y="573.3" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: C, RE, E4, E5, F9a, F9, F10a, F10, F11, F12</text></g><g><rect x="516.7" y="658.2" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="516.7" y="658.2" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><path d="M526.7,658.2H623.7V762.2H526.7Q516.7,762.2 516.7,752.2V668.2Q516.7,658.2 526.7,658.2Z" fill="#9085e9" fill-opacity="0.22"/><text x="528.7" y="678.2" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Does Capability × Intent fit</text><text x="528.7" y="693.2" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">this case?</text><text x="528.7" y="722.2" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Half-filled</text><text x="528.7" y="736.2" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">1 of 4 established or refuted</text><text x="528.7" y="751.2" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: D, RP, E7, E10</text></g><g transform="rotate(-6 376.3 710.2)"><rect x="269.3" y="658.2" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="269.3" y="658.2" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><text x="281.3" y="678.2" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">What was the 2023 plan for?</text><text x="281.3" y="722.2" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Empty, tilted: open</text><text x="281.3" y="736.2" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">0 of 4 established or refuted</text><text x="281.3" y="751.2" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: R1, R2, R3, R4</text></g><g><rect x="115.1" y="480.3" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="115.1" y="480.3" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><path d="M125.1,480.3H222.1V584.3H125.1Q115.1,584.3 115.1,574.3V490.3Q115.1,480.3 125.1,480.3Z" fill="#9085e9" fill-opacity="0.22"/><text x="127.1" y="500.3" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Is the Court acting for its</text><text x="127.1" y="515.3" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">own power?</text><text x="127.1" y="544.3" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Half-filled</text><text x="127.1" y="558.3" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">1 of 2 established or refuted</text><text x="127.1" y="573.3" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: R5s, R5w</text></g><g><rect x="170.2" y="258.5" width="214" height="104" rx="10" fill="#1a1a19"/><rect x="170.2" y="258.5" width="214" height="104" rx="10" fill="none" stroke="#9085e9" stroke-width="2"/><path d="M180.2,258.5H277.2V362.5H180.2Q170.2,362.5 170.2,352.5V268.5Q170.2,258.5 180.2,258.5Z" fill="#9085e9" fill-opacity="0.22"/><text x="182.2" y="278.5" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">Is the record of Basic Laws</text><text x="182.2" y="293.5" font-size="12" font-weight="600" text-anchor="start" fill="#f0efec">complete and correct?</text><text x="182.2" y="322.5" font-size="11" font-weight="600" text-anchor="start" fill="#f0efec">Half-filled</text><text x="182.2" y="336.5" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">3 of 8 established or refuted</text><text x="182.2" y="351.5" font-size="10" font-weight="normal" text-anchor="start" fill="#c3c2b7">Items: F1, F2, F3, F4, F5, F6, F7, F8</text></g><circle cx="402.2" cy="365.9" r="11" fill="#1a1a19" stroke="#9085e9" stroke-width="1.5"/><text x="402.2" y="369.9" font-size="11" font-weight="bold" text-anchor="middle" fill="#9085e9">1</text><circle cx="337.9" cy="380.5" r="11" fill="#1a1a19" stroke="#9085e9" stroke-width="1.5"/><text x="337.9" y="384.5" font-size="11" font-weight="bold" text-anchor="middle" fill="#9085e9">2</text><circle cx="501.3" cy="654.9" r="11" fill="#1a1a19" stroke="#9085e9" stroke-width="1.5"/><text x="501.3" y="658.9" font-size="11" font-weight="bold" text-anchor="middle" fill="#9085e9">3</text><text x="24.0" y="841.0" font-size="13" font-weight="600" text-anchor="start" fill="#9085e9">Threads (imagined; premises from the record, conclusions conjectures)</text><text x="24.0" y="861.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">1. Premises: 14 of the 130 laws titled Basic Law came before the Court, challenged or ruled on as to their binding force</text><text x="24.0" y="876.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">(research/frame/basic-law-frame.csv), and T1 needs six laws on which its two predictions differ (note, T1 as revised, step 7). Conjecture: Perhaps the</text><text x="24.0" y="891.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">Court's own record is too small to tell doctrine from politics, and a test might need other courts' records.</text><text x="24.0" y="912.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">2. Premises: Laws titled Basic Law were passed at 4 in 1958 and 1959, then 5, 5 and 12 in the next three decades, 34, 25 and 23 in the three after</text><text x="24.0" y="927.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">that, and 22 in the 2020s to July 2026 (research/frame/basic-law-frame.csv). Medina writes that a bipartisan tradition once mitigated the</text><text x="24.0" y="942.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">simple-majority power to amend, and that in recent years, especially since the government elected at the end of 2022, it has been exploited (p. 708).</text><text x="24.0" y="957.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">Conjecture: Perhaps routine amendment is part of a standing vulnerability, the structural reading's concern, that one actor's capability times intent</text><text x="24.0" y="972.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">might miss.</text><text x="24.0" y="993.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">3. Premises: Medina's substance-level reply to the elite critique rests on the 2023 plan's aims (pp. 684-685), and test T2 is designed to catalogue</text><text x="24.0" y="1008.0" font-size="11" font-weight="normal" text-anchor="start" fill="#f0efec">what the government did with its powers (note, Proposed tests, T2). Conjecture: Perhaps T2's results might bear on Claim C as well as on the rivals.</text><text x="24.0" y="1035.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">Rule for pieces: A piece is a question the project asks. It gathers the ledger items named on it. Filled: every item is established or refuted.</text><text x="24.0" y="1050.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">Half-filled: at least one item is established, refuted, or inconclusive under a rule set before the run. Empty and tilted: none is. A fill shows</text><text x="24.0" y="1065.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">that something bearing on the question is settled, not that the question is near an answer. Work that settled nothing gets no piece: the first-day</text><text x="24.0" y="1080.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">illustrative table, the first draw of the sample, and the exploratory statistic of T1's first run.</text><text x="24.0" y="1099.0" font-size="11" font-weight="normal" text-anchor="start" fill="#c3c2b7">Item IDs are the ledger's (figures/data/fig6-ledger.csv). Pieces: figures/data/fig8-jigsaw.csv, from figures/sources/jigsaw.json.</text>
</svg>
